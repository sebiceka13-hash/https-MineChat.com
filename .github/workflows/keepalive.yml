name: Keep Render awake

# Render's free plan sleeps the service after ~15 minutes without traffic, and
# the first request after that takes 30-60 seconds. A ping every 10 minutes
# keeps it warm so chat and images answer right away.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -m 90 -o /dev/null -w "%{http_code}" https://https-minechat-com-1.onrender.com/api/status || true)
            echo "attempt $i -> $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          exit 0
